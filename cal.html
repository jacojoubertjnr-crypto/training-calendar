<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Add to calendar</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #5c6670;
      --border: #dde1e6;
      --accent: #1a7f5a;
      --accent-text: #ffffff;
      --button: #eef1f4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121417;
        --card: #1c1f23;
        --text: #e9ecef;
        --muted: #9aa4ae;
        --border: #30353b;
        --accent: #3fb984;
        --accent-text: #0d1a14;
        --button: #262a2f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 16px;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 20px;
    }
    .eyebrow { margin: 0 0 4px; color: var(--muted); font-size: 14px; }
    h1 { margin: 0 0 12px; font-size: 22px; line-height: 1.25; overflow-wrap: anywhere; }
    dl { margin: 0 0 24px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
    .buttons { display: grid; gap: 10px; }
    a.button {
      display: block;
      text-align: center;
      padding: 13px 16px;
      border-radius: 10px;
      background: var(--button);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      border: 1px solid var(--border);
    }
    a.button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    a.button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .note { margin: 20px 0 0; color: var(--muted); font-size: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <p id="status">Loading your training…</p>

    <section id="event" hidden>
      <p class="eyebrow">Training booking</p>
      <h1 id="title"></h1>
      <dl>
        <dt>Date</dt><dd id="day"></dd>
        <dt>Time</dt><dd id="time"></dd>
        <dt id="location-label">Venue</dt><dd id="location"></dd>
      </dl>
      <div class="buttons">
        <a class="button primary" id="outlook" target="_blank" rel="noopener">Add to Outlook</a>
        <a class="button" id="google" target="_blank" rel="noopener">Add to Google Calendar</a>
        <a class="button" id="ics">Download for iPhone / other calendar</a>
      </div>
      <p class="note">Save the event in your calendar to get its reminder. You'll also get a WhatsApp reminder on the morning of the training.</p>
    </section>
  </main>

  <script>
    // Set this to your project's calendar function before publishing.
    const FUNCTION_URL = "https://qrouoqzrbjwhmejoxcaw.supabase.co/functions/v1/calendar";

    const $ = (id) => document.getElementById(id);
    const id = new URLSearchParams(location.search).get("id") || "";

    function fail(message) {
      $("status").textContent = message;
      $("status").hidden = false;
      $("event").hidden = true;
    }

    async function load() {
      if (!/^[0-9a-f-]{36}$/i.test(id)) return fail("This link is incomplete. Please use the link from WhatsApp.");
      let res;
      try {
        res = await fetch(`${FUNCTION_URL}?id=${encodeURIComponent(id)}`);
      } catch {
        return fail("Couldn't load the training. Check your connection and try again.");
      }
      if (res.status === 404) return fail("This booking no longer exists. It may have been cancelled.");
      if (!res.ok) return fail("Couldn't load the training. Please try again later.");

      const e = await res.json();
      $("title").textContent = e.title;
      $("day").textContent = e.day;
      $("time").textContent = e.time || (e.all_day ? "All day (time to be confirmed)" : "");
      if (e.location) {
        $("location").textContent = e.location;
      } else {
        $("location").hidden = true;
        $("location-label").hidden = true;
      }
      $("outlook").href = e.outlook_url;
      $("google").href = e.google_url;
      $("ics").href = `${FUNCTION_URL}?id=${encodeURIComponent(id)}&format=ics`;
      document.title = `Add to calendar: ${e.title}`;
      $("status").hidden = true;
      $("event").hidden = false;
    }

    load();
  </script>
</body>
</html>
